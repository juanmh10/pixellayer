# Nginx Reverse Proxy Configuration for PixelLayer MCP Server
# Place in /etc/nginx/sites-available/pixellayer and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name mcp.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/mcp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Public health check endpoint for uptime monitors / load balancers
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # Require Authorization Bearer Header for all MCP operations
        if ($http_authorization != "Bearer <REPLACE_WITH_YOUR_TOKEN>") {
            return 401 '{"error": "Unauthorized: Missing or invalid MCP Bearer Token"}\n';
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Disable proxy buffering for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        # Forwarded connection headers
        # Use 127.0.0.1:8000 to comply with FastMCP DNS rebinding protection
        proxy_set_header Connection '';
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

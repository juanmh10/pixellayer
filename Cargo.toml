[package]
name = "pixellayer"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Local image processing CLI and MCP server with BiRefNet ONNX inference"

[[bin]]
name = "pixellayer"
path = "rust/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
webp = "0.3"
vtracer = { path = "vendor/vtracer", version = "=0.6.5" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# Inspect typed certificate failures without retrying permanent trust errors.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rmcp = { version = "=1.4.0", default-features = false, features = ["server", "macros", "transport-io"] }
# Match macros to the pinned SDK; later minor macro releases require newer SDK APIs.
rmcp-macros = "=1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }

[profile.release]
strip = true
